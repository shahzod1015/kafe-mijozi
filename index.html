<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kafe Menyu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 pb-28">

  <!-- Header -->
  <header class="bg-amber-600 text-white p-4 sticky top-0 shadow-md flex justify-between items-center z-20">
    <div>
      <h1 class="text-xl font-bold">Kafe Menyusi</h1>
      <p id="table-display" class="text-xs text-amber-100">Stol aniqlanmadi</p>
    </div>
    <div id="cart-count" class="bg-amber-800 px-3 py-1 rounded-full text-sm font-bold">
      Savat: 0
    </div>
  </header>

  <!-- Categoriyalar bo'limi -->
  <div class="bg-white sticky top-[60px] z-10 shadow-sm border-b p-2">
    <div id="categories-container" class="flex gap-2 overflow-x-auto no-scrollbar py-1">
      <button onclick="filterCategory('all')" id="cat-btn-all" class="bg-amber-600 text-white px-4 py-1.5 rounded-full text-sm font-semibold whitespace-nowrap">
        Barchasi
      </button>
    </div>
  </div>

  <!-- Menyu Ro'yxati -->
  <main id="menu-container" class="p-4 grid gap-4 grid-cols-1 sm:grid-cols-2">
    <p class="text-gray-500 text-center col-span-full">Menyu yuklanmoqda...</p>
  </main>

  <!-- Buyurtma berish tugmasi -->
  <div class="fixed bottom-0 left-0 right-0 bg-white p-4 shadow-lg border-t flex justify-between items-center z-20">
    <div>
      <span class="text-xs text-gray-500">Jami:</span>
      <p id="total-price" class="text-lg font-bold text-amber-600">0 SUM</p>
    </div>
    <button onclick="submitOrder()" class="bg-amber-600 hover:bg-amber-700 text-white font-bold py-2.5 px-6 rounded-lg shadow active:scale-95 transition-transform">
      Buyurtma berish
    </button>
  </div>

  <script>
    // Supabase obyektini to'g'ri chaqirish
    const SUPABASE_URL = 'https://wrrsvrgdinfmnuwewtoa.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndycnN2cmdkaW5mbW51d2V3dG9hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NzM0ODIsImV4cCI6MjEwMjU0OTQ4Mn0.YRHratsKVG42IY6YKokDycRy23oU8N3b7jO-o3tpQF4';
    
    // CDN ulanishidagi xatolik to'g'rilandi:
    const supabase = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const urlParams = new URLSearchParams(window.location.search);
    const tableNumber = urlParams.get('table') || '1';
    document.getElementById('table-display').innerText = `${tableNumber}-sonli stol`;

    let cart = {};
    let menuData = [];
    let selectedCategory = 'all';

    async function fetchMenu() {
      try {
        const { data, error } = await supabase
          .from('menu')
          .select('*');

        if (error) throw error;

        // Stop-list bo'lmagan taomlarni saralash
        menuData = (data || []).filter(item => item.is_stop !== true && item.is_available !== false);
        
        renderCategories();
        renderMenu();
      } catch (err) {
        console.error('Xatolik yuz berdi:', err);
        document.getElementById('menu-container').innerHTML = 
          `<p class="text-red-500 font-bold text-center col-span-full">Menyuni yuklab bo'lmadi: ${err.message || err}</p>`;
      }
    }

    function renderCategories() {
      const catContainer = document.getElementById('categories-container');
      const categories = [...new Set(menuData.map(item => item.category || item.category_name).filter(Boolean))];
      
      let html = `
        <button onclick="filterCategory('all')" 
          class="${selectedCategory === 'all' ? 'bg-amber-600 text-white' : 'bg-gray-200 text-gray-700'} px-4 py-1.5 rounded-full text-sm font-semibold whitespace-nowrap transition-colors">
          Barchasi
        </button>
      `;

      categories.forEach(cat => {
        const isActive = selectedCategory === cat;
        html += `
          <button onclick="filterCategory('${cat}')" 
            class="${isActive ? 'bg-amber-600 text-white' : 'bg-gray-200 text-gray-700'} px-4 py-1.5 rounded-full text-sm font-semibold whitespace-nowrap transition-colors">
            ${cat}
          </button>
        `;
      });

      catContainer.innerHTML = html;
    }

    function filterCategory(category) {
      selectedCategory = category;
      renderCategories();
      renderMenu();
    }

    function renderMenu() {
      const container = document.getElementById('menu-container');
      
      const filteredMenu = selectedCategory === 'all' 
        ? menuData 
        : menuData.filter(item => (item.category || item.category_name) === selectedCategory);

      if (!filteredMenu || filteredMenu.length === 0) {
        container.innerHTML = '<p class="text-gray-500 text-center col-span-full py-8">Sotuvda taomlar mavjud emas.</p>';
        return;
      }

      container.innerHTML = filteredMenu.map(item => {
        const currentQty = cart[item.id] || 0;
        return `
          <div class="bg-white p-3 rounded-xl shadow-sm flex gap-4 items-center">
            <img src="${item.image_url || item.image || 'https://via.placeholder.com/100'}" class="w-20 h-20 object-cover rounded-lg bg-gray-100">
            <div class="flex-1">
              <h3 class="font-bold text-base text-gray-800">${item.title || item.name}</h3>
              <p class="text-amber-600 font-bold mt-1">${Number(item.price || 0).toLocaleString()} SUM</p>
            </div>
            <div class="flex items-center gap-2">
              ${currentQty > 0 ? `
                <button onclick="changeQuantity(${item.id}, -1)" class="w-8 h-8 bg-gray-200 active:bg-gray-300 rounded-full font-bold text-lg flex items-center justify-center">-</button>
                <span class="font-bold min-w-[16px] text-center">${currentQty}</span>
              ` : ''}
              <button onclick="changeQuantity(${item.id}, 1)" class="w-8 h-8 bg-amber-600 active:bg-amber-700 text-white rounded-full font-bold text-lg flex items-center justify-center">+</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function changeQuantity(id, delta) {
      if (!cart[id]) cart[id] = 0;
      cart[id] += delta;
      if (cart[id] <= 0) delete cart[id];

      renderMenu();
      updateCartSummary();
    }

    function updateCartSummary() {
      let total = 0;
      let count = 0;

      for (let id in cart) {
        const item = menuData.find(m => m.id == id);
        if (item) {
          total += (item.price || 0) * cart[id];
          count += cart[id];
        }
      }

      document.getElementById('total-price').innerText = `${total.toLocaleString()} SUM`;
      document.getElementById('cart-count').innerText = `Savat: ${count}`;
    }

    async function submitOrder() {
      const itemIds = Object.keys(cart);
      if (itemIds.length === 0) {
        alert("Iltimos, kamida bitta taom tanlang!");
        return;
      }

      const orderItems = itemIds.map(id => {
        const item = menuData.find(m => m.id == id);
        return {
          id: item.id,
          name: item.title || item.name,
          price: item.price,
          qty: cart[id]
        };
      });

      let totalPrice = orderItems.reduce((sum, i) => sum + (i.price * i.qty), 0);

      const { data, error } = await supabase
        .from('orders')
        .insert([
          {
            table_num: tableNumber.toString(),
            items: orderItems,
            total_price: totalPrice,
            status: 'yangi',
            created_at: new Date().toISOString()
          }
        ]);

      if (error) {
        alert("Buyurtma yuborishda xatolik yuz berdi!");
        console.error(error);
      } else {
        alert(`${tableNumber}-stol uchun buyurtmangiz oshxonaga yuborildi!`);
        cart = {};
        renderMenu();
        updateCartSummary();
      }
    }

    fetchMenu();
  </script>
</body>
</html>
